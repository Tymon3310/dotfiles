# tmux: self-contained, no plugins.
# Prefix is Ctrl+A (Ctrl+B also works). Reload: prefix + r.
#
#   Panes      prefix |  -       split right / down (same folder)
#              Alt + arrows      move between panes (no prefix)
#              prefix h j k l    move;  prefix H J K L  resize (repeatable)
#              prefix z          zoom;  prefix x  close;  prefix S  sync input
#   Windows    Alt + 1..9        jump to window (no prefix)
#              Shift + ←/→       previous / next window
#              prefix c          new window (same folder);  prefix < >  reorder
#   Sessions   prefix s          pick session / window
#              prefix N          new named session
#   Popups     prefix t          shell        prefix g  lazygit
#              prefix y          yazi         prefix b  btop
#   Copy       prefix [ or scroll up, then v select, y copy (Wayland clipboard)

# Terminal
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB:clipboard:hyperlinks:usstyle:extkeys:sync"
set -as terminal-features ",*256col*:RGB"
set -g allow-passthrough on        # kitty images (fastfetch, yazi previews)
set -s extended-keys on            # Ctrl+Shift bindings reach apps
set -s escape-time 0
set -s focus-events on
set -s set-clipboard on
set -s copy-command "wl-copy"
set -g mouse on
set -g history-limit 100000

# Behaviour
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off       # closing a session switches to another
set -g display-time 1500
set -g repeat-time 500
setw -g monitor-activity on
set -g visual-activity off
setw -g automatic-rename on
setw -g automatic-rename-format "#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}"
set -g set-titles on
set -g set-titles-string "#S · #W"

# Keys
unbind C-b
set -g prefix C-a
set -g prefix2 C-b
bind C-a send-prefix
bind C-b send-prefix -2

bind r source-file ~/.tmux.conf \; display "  config reloaded"

bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind x kill-pane
bind X confirm-before -p "kill window #W? (y/n)" kill-window

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -n S-Left previous-window
bind -n S-Right next-window
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind S setw synchronize-panes \; display "  sync #{?synchronize-panes,on,off}"
bind s choose-tree -Zs
bind N command-prompt -p "new session:" "new-session -A -s '%%' -c '#{pane_current_path}'"

bind t display-popup -E -w 80% -h 75% -d "#{pane_current_path}"
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind y display-popup -E -w 90% -h 85% -d "#{pane_current_path}" yazi
bind b display-popup -E -w 85% -h 80% btop

# Copy mode (vi keys)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# Theme: the blue from the rest of the desktop, transparent bar so kitty's
# background opacity shows through.
set -g @base    "#0b1220"
set -g @surface "#1b2638"
set -g @muted   "#5d6f88"
set -g @text    "#e6f0ff"
set -g @blue    "#0099ff"
set -g @navy    "#005cb3"
set -g @cyan    "#00e5ff"
set -g @pink    "#ff5f9e"
set -g @yellow  "#ffcc33"
# Session pill colour: pink while the prefix is held, yellow in copy mode.
set -g @mode    "#{?client_prefix,#{@pink},#{?pane_in_mode,#{@yellow},#{@blue}}}"

set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#{@text}"
set -g status-left-length 40
set -g status-right-length 80

set -g status-left "#[fg=#{E:@mode}]#[bg=#{E:@mode},fg=#{@base},bold]#{?client_prefix,󰌌 ,#{?pane_in_mode,󰆏 ,󰆍 }}#S#[bg=default,fg=#{E:@mode},nobold] "

setw -g window-status-separator ""
setw -g window-status-format "#[fg=#{@muted}] #I #[fg=#{@text}]#W#{?window_zoomed_flag, 󰊓,}#{?window_activity_flag,#[fg=#{@yellow}] ●,} "
setw -g window-status-current-format "#[fg=#{@navy}]#[bg=#{@navy},fg=#{@cyan},bold]#I #[fg=#{@text}]#W#{?window_zoomed_flag, 󰊓,}#[bg=default,fg=#{@navy},nobold]"
setw -g window-status-activity-style "none"
setw -g window-status-current-style "none"   # tmux 3.8 underlines it by default

set -g status-right "#{?synchronize-panes,#[fg=#{@pink}]󰓦 sync  ,}#[fg=#{@muted}]󰒋 #h  #[fg=#{@surface}]#[bg=#{@surface},fg=#{@text}]󰥔 %H:%M#[bg=default,fg=#{@surface}]"

set -g pane-border-lines single
set -g pane-border-indicators arrows
set -g pane-border-style "fg=#{@surface}"
set -g pane-active-border-style "fg=#{@blue}"
set -g display-panes-active-colour "#0099ff"
set -g display-panes-colour "#5d6f88"

set -g message-style "bg=#{@surface},fg=#{@text}"
set -g message-command-style "bg=#{@surface},fg=#{@cyan}"
setw -g mode-style "bg=#{@navy},fg=#{@text}"
setw -g copy-mode-match-style "bg=#{@surface},fg=#{@yellow}"
setw -g copy-mode-current-match-style "bg=#{@yellow},fg=#{@base}"
set -g popup-style "bg=default,fg=#{@text}"
set -g popup-border-lines rounded
set -g popup-border-style "fg=#{@blue}"
set -g menu-style "bg=#{@base},fg=#{@text}"
set -g menu-selected-style "bg=#{@navy},fg=#{@text}"
set -g menu-border-lines rounded
set -g menu-border-style "fg=#{@blue}"
setw -g clock-mode-colour "#0099ff"

# Machine-specific overrides, if any (not tracked).
source-file -q ~/.tmux.local.conf
