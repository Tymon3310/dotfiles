# SDDM greeter on Wayland, with KWin as its compositor (KDE's recommended
# flags). Installed and removed by sddm/scripts/sddm-wayland.sh.
#
# Under X11 only one screen's greeter got the keyboard, so the other outputs
# were switched off in Xsetup. KWin gives focus to the screen you click.
[General]
DisplayServer=wayland
# Plain Wayland windows cannot pick an output, so KWin stacked every
# screen's greeter on one monitor (the others stayed blank, and the hidden
# ones stopped redrawing). Layer-shell windows are pinned to their own
# screen. This line replaces zz-nocturne.conf's, so it carries that file's
# setting too (AMD_DEBUG=nodcc there is for X11 only).
GreeterEnvironment=QML_XHR_ALLOW_FILE_READ=1,QT_WAYLAND_SHELL_INTEGRATION=layer-shell

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1
